<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singer’s Symbol Palette</title><style>
:root{color-scheme:light dark; font:16px system-ui;--accent:#367c88}*{box-sizing:border-box}body{max-width:820px;margin: auto;padding:24px}h1{font-size:1.65rem;margin:0}p{color:GrayText}h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px;color:GrayText}.grid{display:flex;flex-wrap:wrap;gap:6px}button,select{font:inherit;border:1px solid GrayText;border-radius:8px;background:Canvas;color:CanvasText;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, Canvas)}button:focus-visible{outline:3px solid var(--accent)}.symbol{font-family:'Charis SIL','Doulos SIL','Arial Unicode MS',system-ui,sans-serif;font-size:25px;min-width:45px;height:46px;padding:4px 9px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}textarea{width:100%;min-height:110px;resize:vertical;font:24px 'Charis SIL','Doulos SIL',system-ui,sans-serif;border:1px solid GrayText;border-radius:10px;padding:12px;background:Canvas;color:CanvasText}.primary{background:#286773;color:white;border-color:#286773}#status{min-height:1.5em;font-size:.85rem;color:GrayText}label{font-size:.9rem}footer{font-size:.8rem;color:GrayText;margin-top:20px}section[hidden]{display:none}button[aria-pressed=true]{outline:2px solid var(--accent)} 
/* Compact default layout */
:root{font-size:13px}body{max-width:560px;padding:10px 12px}h1{font-size:1.35rem}body>p{margin:4px 0 8px;font-size:.9rem}h2{font-size:.78rem;margin:9px 0 4px;letter-spacing:.05em}.grid{gap:3px}button,select{padding:4px 7px;border-radius:5px}.symbol{font-size:20px;min-width:30px;height:31px;padding:1px 5px}.toolbar{gap:5px}textarea{min-height:58px;font-size:20px;padding:6px;border-radius:6px}#status{min-height:1.2em;font-size:.8rem}footer{margin-top:9px;font-size:.75rem}label input{margin:0 3px 0 0;vertical-align:middle}
/* Match the palette's IPA font stack, including its Unicode fallback. */
textarea#editor{font-family:'Charis SIL','Doulos SIL','Arial Unicode MS',system-ui,sans-serif;line-height:1.55;letter-spacing:normal;font-kerning:normal;font-variant-ligatures:normal}
.fig{display:inline-table;vertical-align:middle;border-collapse:collapse;line-height:1;font-size:.72em;text-align:center}.fig span{display:table-row}.fig span b{display:table-cell;font-weight:normal;padding:0 1px}.symbol .fig{font-size:.65em}#formattedPreview{white-space:pre-wrap;overflow-wrap:anywhere;font:20px 'Charis SIL','Doulos SIL','Arial Unicode MS',system-ui,sans-serif;line-height:1.55;border:1px solid GrayText;border-radius:6px;padding:6px;margin:4px 0}#formattedPreview[hidden]{display:none}
/* Keep IPA compact; allow music and stacked figures extra vertical room. */
#palette.theory .symbol, #palette .symbol.stacked {height:auto;min-height:38px;padding:3px 5px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:1px}
#palette.theory .symbol {font-size:18px}
#palette .symbol.stacked .fig {font-size:.68em !important;line-height:1.05 !important;vertical-align:middle}
#formattedPreview[contenteditable=true]{min-height:58px;cursor:text;outline-offset:2px}#formattedPreview:empty:before{content:attr(data-placeholder);color:GrayText;pointer-events:none}#formattedPreview .fig{user-select:all}textarea[hidden]{display:none}

/* Keep Unicode glyphs slightly above the optical center without enlarging buttons. */
#palette:not(.theory) .symbol {display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0 5px 4px;}

/* Self-hosted Charis for IPA; retain existing music theory fonts. */
@font-face{font-family:'Charis Web';src:url('./fonts/Charis-Regular.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
#palette:not(.theory) .symbol,textarea#editor{font-family:'Charis Web','Charis','Charis SIL','Doulos SIL','Arial Unicode MS',system-ui,sans-serif}
</style><body><h1>Singer’s Symbol Palette</h1><p>IPA, music theory and diction marks — ready to copy.</p><div class="toolbar"><label for="language">Symbol set</label><select id="language"><option>All</option><option>English</option><option>French</option><option>German</option><option>Italian</option><option>Music theory</option></select><label><input type="checkbox" id="single"> Copy individual symbols</label></div><section id="compose"><h2><span>Compose text</span></h2><textarea id="editor" spellcheck="false" placeholder="Type here, then select symbols to insert at the cursor…"></textarea><div id="formattedPreview" hidden role="textbox" aria-multiline="true" aria-label="Compose formatted text" data-placeholder="Type here, then select symbols…"></div><div class="toolbar"><button class="primary" id="copy">Copy text</button><button id="clear">Clear</button><button id="back">Backspace</button></div></section><div id="status" role="status" aria-live="polite"></div><main id="palette"></main><footer>Works offline. Recent symbols and preferences are saved locally when browser storage is available.</footer><script>
const groups={'Musical symbols':'♯ ♭ ♮ 𝄪 𝄫 ° ø Δ + −','Vowels':'i ɪ e ɛ æ a ɑ ɒ ɔ o ʊ u y ʏ ø œ ə ɐ ʌ ɜ','Nasal vowels':'ɑ̃ ɛ̃ ɔ̃ œ̃ õ æ̃','Consonants':'p b t d k ɡ f v s z m n l r h j w ʃ ʒ ç x ŋ ɲ ʎ ɹ ɾ ʀ ʁ θ ð ʔ','Stress and diction marks':'ˈ ˌ ː ˑ ̃ ̩ ̥ ̯ ʰ ʲ ‿ . [ ] /'};
const theoryGroups={ 'Roman numerals':'I II III IV V VI VII i ii iii iv v vi vii', 'Chord quality and inversion':'⁶ ⁷ ⁶₄ ⁶₅ ⁴₃ ⁴₂ ² ⁹ ¹¹ ¹³', 'Common harmonic labels':'Cad⁶₄ N⁶ It⁺⁶ Fr⁺⁶ Gr⁺⁶ V/V V⁷/V', 'Scale degrees':'1̂ 2̂ 3̂ 4̂ 5̂ 6̂ 7̂ ♭2̂ ♭3̂ ♯4̂ ♭6̂ ♭7̂', 'Intervals':'P1 m2 M2 m3 M3 P4 A4 d5 P5 m6 M6 m7 M7 P8', 'Superscripts':'⁰ ¹ ² ³ ⁴ ⁵ ⁶ ⁷ ⁸ ⁹ ⁺ ⁻', 'Subscripts':'₀ ₁ ₂ ₃ ₄ ₅ ₆ ₇ ₈ ₉ ₊ ₋', 'Rhythm and notation':'𝄞 𝄢 𝄡 𝄐 𝄆 𝄇 𝄋 𝄌 ♪ ♫ 𝅝 𝅗𝅥 𝅘𝅥 𝅘𝅥𝅮 𝅘𝅥𝅯 𝄽 𝄾'}; Object.assign(groups,theoryGroups);
const sets={English:'i ɪ e ɛ æ a ɑ ɒ ɔ o ʊ u ə ʌ ɜ p b t d k ɡ f v s z m n l r h j w ʃ ʒ ŋ ɹ ɾ θ ð ʔ',French:'i e ɛ a ɑ ɔ o u y ø œ ə ɑ̃ ɛ̃ ɔ̃ œ̃ p b t d k ɡ f v s z m n l r j w ʃ ʒ ŋ ɲ ʁ ʀ',German:'i ɪ e ɛ a ɑ ɔ o ʊ u y ʏ ø œ ə ɐ p b t d k ɡ f v s z m n l r h j ʃ ʒ ç x ŋ ʁ ʀ ʔ',Italian:'i e ɛ a ɔ o u p b t d k ɡ f v s z m n l r j w ʃ ŋ ɲ ʎ ɾ'};
const $=id=>document.getElementById(id);const editor=$('editor');let start=0,end=0;function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}}let recent=load('sp-recent');function settings(){return {version:1,recent,symbolSet:$('language').value,single:$('single').checked}}function save(){try{const data=settings();localStorage.setItem('sp-settings',JSON.stringify(data));for(const k of ['recent'])localStorage.setItem('sp-'+k,JSON.stringify(data[k]));localStorage.setItem('sp-symbol-set',data.symbolSet);return true}catch{status('Browser storage unavailable.');return false}}function applySettings(d){if(!d||!Array.isArray(d.recent))return;recent=d.recent.filter(x=>typeof x==='string').slice(0,12);if([...$('language').options].some(o=>o.value===d.symbolSet))$('language').value=d.symbolSet;$('single').checked=d.single===true;$('compose').hidden=$('single').checked}function status(t){$('status').textContent=t}async function copyPlain(t){try{await navigator.clipboard.writeText(t);status('Copied: '+t)}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();status(ok?'Copied: '+t:'Clipboard unavailable. Select and copy manually.');if(!ok){editor.value=t;$('single').checked=false;$('compose').hidden=false;preview();if(richTheory()){formatted.focus();const r=document.createRange();r.selectNodeContents(formatted);getSelection().removeAllRanges();getSelection().addRange(r)}else{editor.focus();editor.select()}}}}
const supers='⁰¹²³⁴⁵⁶⁷⁸⁹', subs='₀₁₂₃₄₅₆₇₈₉';
const escapeHTML=t=>t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const figurePattern=/([⁰¹²³⁴⁵⁶⁷⁸⁹])([₀₁₂₃₄₅₆₇₈₉])/g;
function asciiFigures(t){return Array.from(t,c=>supers.includes(c)?String(supers.indexOf(c)):subs.includes(c)?String(subs.indexOf(c)):c==='⁺'?'+':c==='⁻'?'-':c).join('')}
function richHTML(t){return escapeHTML(t).replace(figurePattern,(_,a,b)=>`<span style="display:inline-table;vertical-align:middle;border-collapse:collapse;line-height:1;font-size:0.72em;text-align:center" class="fig"><span style="display:table-row"><b style="display:table-cell;font-weight:normal;padding:0 1px">${supers.indexOf(a)}</b></span><span style="display:table-row"><b style="display:table-cell;font-weight:normal;padding:0 1px">${subs.indexOf(b)}</b></span></span>`).replace(/\n/g,'<br>')}
const formatted=$('formattedPreview');
function richTheory(){return $('language').value==='Music theory'&&copyFormat()==='rich'}
function rawText(node){if(node.nodeType===3)return node.data;if(node.nodeType===1&&node.dataset.raw)return node.dataset.raw;if(node.nodeName==='BR')return '\n';return Array.from(node.childNodes,rawText).join('')}
function selectionOffset(node,offset){const r=document.createRange();r.selectNodeContents(formatted);r.setEnd(node,offset);return rawText(r.cloneContents()).length}
function rememberRich(){const sel=getSelection();if(sel.rangeCount&&formatted.contains(sel.anchorNode)&&formatted.contains(sel.focusNode)){const r=sel.getRangeAt(0);start=selectionOffset(r.startContainer,r.startOffset);end=selectionOffset(r.endContainer,r.endOffset)}}
function restoreRich(){const r=document.createRange();let pos=0,done=false;for(const n of formatted.childNodes){const len=rawText(n).length;if(start<=pos+len){if(n.nodeType===3)r.setStart(n,Math.max(0,start-pos));else if(start===pos)r.setStartBefore(n);else r.setStartAfter(n);done=true;break}pos+=len}if(!done){r.selectNodeContents(formatted);r.collapse(false)}else r.collapse(true);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
function preview(){const active=richTheory();editor.hidden=active;formatted.hidden=copyFormat()!=='rich';formatted.contentEditable=active?'true':'false';formatted.innerHTML=richHTML(editor.value);if(active){let matches=[...editor.value.matchAll(figurePattern)];formatted.querySelectorAll('.fig').forEach((n,i)=>{n.dataset.raw=matches[i][0];n.contentEditable='false'});}}
formatted.addEventListener('input',()=>{rememberRich();editor.value=rawText(formatted);start=end=Math.min(start,editor.value.length);preview();restoreRich()});
for(const e of ['keyup','mouseup','blur'])formatted.addEventListener(e,rememberRich);
formatted.addEventListener('beforeinput',e=>{if(!richTheory())return;rememberRich();if(e.inputType==='insertParagraph'||e.inputType==='insertLineBreak'){e.preventDefault();insert('\n')}});
formatted.addEventListener('paste',e=>{if(!richTheory())return;e.preventDefault();rememberRich();insert(e.clipboardData.getData('text/plain'))});
async function copy(t){const mode=copyFormat();if(mode!=='rich')return copyPlain(t);try{await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([t],{type:'text/plain'}),'text/html':new Blob(['<div style="white-space:pre-wrap">'+richHTML(t)+'</div>'],{type:'text/html'})})]);status('Copied formatted text (Unicode fallback included).')}catch{const d=document.createElement('div');d.contentEditable='true';d.style.cssText='position:fixed;left:-9999px;white-space:pre-wrap';d.innerHTML=richHTML(t);document.body.append(d);const sel=window.getSelection(),r=document.createRange();r.selectNodeContents(d);sel.removeAllRanges();sel.addRange(r);let ok=false;try{ok=document.execCommand('copy')}catch{}sel.removeAllRanges();d.remove();if(ok)status('Copied rich selection; paste support varies.');else{await copyPlain(t);status('Rich clipboard unavailable; use Unicode fallback.')}}}
function copyFormat(){return $('language').value==='Music theory'?'rich':'unicode'}
function loadFormat(){$('copy').textContent=copyFormat()==='rich'?'Copy formatted text':'Copy Unicode text'}
editor.addEventListener('input',preview);
function remember(){start=editor.selectionStart;end=editor.selectionEnd}for(const e of ['input','select','keyup','click','blur'])editor.addEventListener(e,remember);function insert(s){if(richTheory()){editor.value=editor.value.slice(0,start)+s+editor.value.slice(end);start=end=start+s.length;preview();formatted.focus();restoreRich()}else{editor.focus();editor.setSelectionRange(start,end);editor.setRangeText(s,start,end,'end');remember();preview()}}
function choose(s,k){recent=[s,...recent.filter(x=>x!==s)].slice(0,12);if($('single').checked)copy(s);else insert(s);save();render()}
function button(s,k){const b=document.createElement('button');b.className='symbol';b.textContent=/^\p{Mark}/u.test(s)?'◌'+s:s;if(copyFormat()==='rich'&&/[⁰¹²³⁴⁵⁶⁷⁸⁹][₀₁₂₃₄₅₆₇₈₉]/.test(s)){b.innerHTML=richHTML(s);b.classList.add('stacked')}b.title=s;b.setAttribute('aria-label',s);b.addEventListener('mousedown',e=>e.preventDefault());b.onclick=()=>choose(s,k);return b}
function render(){const root=$('palette');root.replaceChildren();const lang=$('language').value;root.classList.toggle('theory',lang==='Music theory');const active=s=>Object.values(groups).some(v=>v.split(' ').includes(s));const all=[['Recently used',recent.filter(active)],...Object.entries(groups).map(([k,v])=>[k,v.split(' ').filter(s=>lang==='Music theory'?(k==='Musical symbols'||Object.hasOwn(theoryGroups,k)):!Object.hasOwn(theoryGroups,k)&&(lang==='All'||k==='Musical symbols'||k==='Stress and diction marks'||sets[lang].split(' ').includes(s)))])];for(const [name,syms] of all){if(!syms.length)continue;const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=name;grid.className='grid';section.append(h);for(const s of syms)grid.append(button(s,name));section.append(grid);root.append(section)}}
try{const saved=localStorage.getItem('sp-symbol-set');if([...$('language').options].some(o=>o.value===saved))$('language').value=saved}catch{}try{const saved=localStorage.getItem('sp-settings');if(saved)applySettings(JSON.parse(saved))}catch{}loadFormat();$('language').onchange=()=>{save();loadFormat();preview();render()};$('single').onchange=()=>{$('compose').hidden=$('single').checked;save()};$('copy').onclick=()=>copy(editor.value);$('clear').onclick=()=>{editor.value='';start=end=0;preview();(richTheory()?formatted:editor).focus()};$('back').onclick=()=>{if(start===end&&start>0){const before=editor.value.slice(0,start);const segments=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter().segment(before)].map(x=>x.segment):Array.from(before);start-=segments.at(-1).length}insert('')};render();preview();</script></body></html>
